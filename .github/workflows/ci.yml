name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: node:22-trixie
    steps:
      - uses: actions/checkout@v4
      - name: install host deps
        run: apt-get update && apt-get install -y --no-install-recommends make build-essential git ca-certificates curl jq
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: make bootstrap
      - run: make check
      - run: make build

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: bump the patch version
        run: scripts/bump-version.sh
      - name: commit, tag and push
        run: |
          version="$(cat VERSION)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json packages/claude/.claude-plugin/plugin.json
          git commit -m "release: v${version} [skip ci]"
          git tag "v${version}"
          git push origin HEAD:main "v${version}"
